[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "talktype"
version = "1.0.0"
description = "Push-to-talk voice typing that works everywhere"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "sounddevice>=0.4.6",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "requests>=2.28.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "beaupy>=3.0.0",
    "pyautogui>=0.9.53; sys_platform != 'linux'",
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.optional-dependencies]
local = ["faster-whisper>=0.10.0"]
# Streaming with NVIDIA Parakeet (--stream-engine parakeet). onnxruntime and
# huggingface-hub already come with faster-whisper, so this adds ~3 MB.
parakeet = ["onnx-asr[cpu,hub]>=0.12"]
# Native streaming with NVIDIA Nemotron (--stream-engine nemotron).
# onnxruntime-genai keeps the encoder caches between chunks; it uses the
# onnxruntime that faster-whisper already brings.
nemotron = ["onnxruntime-genai>=0.17; python_version >= '3.11'"]
server = ["fastapi>=0.100.0", "uvicorn>=0.22.0", "python-multipart>=0.0.6"]
all = ["talktype[local,server,parakeet,nemotron]"]

[project.scripts]
talktype = "talktype:main"

[tool.setuptools]
py-modules = ["talktype", "streaming", "replacements", "hotkey", "keynames", "autostop", "parakeet", "nemotron", "whisper_server", "setup_wizard"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
