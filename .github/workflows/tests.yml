name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # sounddevice needs PortAudio at import; talktype imports pynput, which
      # needs an X display, so the tests run under Xvfb. Emacs runs the ERT
      # tests and the end-to-end test of the emacs route; sakura (a VTE
      # terminal), xdotool, xclip and xprop (x11-utils) the one of the
      # terminal-paste route; shellcheck lints install.sh.
      # TALKTYPE_REQUIRE_E2E makes these tests fail, not skip, when
      # something they need is missing.
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 xvfb emacs-nox sakura xdotool xclip x11-utils shellcheck
      - name: ERT (talktype.el)
        run: emacs --batch -Q -L . -l tests/talktype-test.el -f ert-run-tests-batch-and-exit
      - name: pytest
        env:
          TALKTYPE_REQUIRE_E2E: "1"
        run: xvfb-run -a uv run --python 3.13 pytest -q
